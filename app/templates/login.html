<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Rclone S3 Management UI</title>
  <script>
    (function () {
      var pref = null;
      try { pref = localStorage.getItem('gb-theme'); } catch (e) {}
      if (pref === 'dark' || (!pref && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/tailwind.css?v={{ asset_version }}">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-app-bg">
  <div class="w-full max-w-sm">
    <div class="card shadow-xl p-8 rounded-2xl">
      <div class="text-center mb-6">
        <div class="mx-auto mb-4 inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-brand to-indigo-500 shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 text-white"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        </div>
        <h1 class="text-xl font-semibold text-ink tracking-tight">Rclone S3 Management UI</h1>
        <p class="text-sm text-ink-muted mt-1">Sign in to continue</p>
      </div>
      {% if error %}
      <div class="mb-4 px-3 py-2 rounded-lg bg-danger-soft border border-danger-line text-danger-fg text-sm flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        {{ error }}
      </div>
      {% endif %}
      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="next" value="{{ next }}">
        <div>
          <label for="username" class="label">Username</label>
          <input id="username" type="text" name="username" required autofocus autocomplete="username" class="input">
        </div>
        <div>
          <label for="password" class="label">Password</label>
          <input id="password" type="password" name="password" required autocomplete="current-password" class="input">
        </div>
        <button type="submit"
                class="btn btn-primary w-full !py-2.5">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
